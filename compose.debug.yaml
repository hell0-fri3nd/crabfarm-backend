services:
  crabfarmbackend:
    image: crabfarmbackend
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m uvicorn App:app --host 0.0.0.0 --port 4572"]
    ports:
      - 4572:4572
      - 5678:5678
